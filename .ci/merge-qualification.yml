# MR pipelines build the exact commit with the shared functional-test rules:
# automatic nonblocking Minimal tests and optional Standard tests.
build_www:
  rules:
    - when: on_success
  allow_failure: false
spec_dependencies:
  rules:
    - when: never
spec_test:
  rules:
    - when: never
make_build_preview_html:
  rules:
    - when: never
upload_build_preview_html:
  only: null
  rules:
    - when: never
build_portable_amd64:
  rules:
    - when: on_success
  allow_failure: false
build_portable_arm64:
  rules:
    - when: never
build_portable_musl_amd64:
  rules:
    - when: on_success
  allow_failure: false
build_portable_musl_arm64:
  rules:
    - when: never
test_portable_amd64:
  rules:
    - when: never
test_portable_arm64:
  rules:
    - when: never
test_portable_musl_amd64:
  rules:
    - when: never
test_portable_musl_arm64:
  rules:
    - when: never
unit_test:
  rules:
    - when: never
unit_test_frontend:
  rules:
    - when: never
unit_test_sanitizers:
  rules:
    - when: never
