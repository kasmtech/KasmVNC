# MR pipelines use a reduced build matrix with shared functional-test rules.
include:
  - local: .ci/build-pipeline.yml
  - local: .ci/merge-qualification.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: always
