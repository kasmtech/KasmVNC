image: docker
services:
  - docker:dind

variables:
  DEBUG: true
  KASMVNC_COMMIT_ID: $CI_COMMIT_SHA
  GITLAB_SHARED_DIND_DIR: /builds/$CI_PROJECT_PATH/shared
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_FETCH_EXTRA_FLAGS: --tags --force
  # For example, BUILD_DISTROS_REGEX: "jammy|noble".
  # "BUILD_DISTROS_REGEX: none" won't build any distros, nor www.
  # "BUILD_DISTROS_REGEX: all" would build all distros.
  # Make sure you quote any whitespace characters you use.
  # E.g. BUILD_DISTROS_REGEX: "jammy|\ noble".
  BUILD_DISTROS_REGEX: all
  BUILD_PORTABLE: "true"
  # Opt in to rebuilding portable-capable distros for comparison/rollback.
  BUILD_FULL_LEGACY: "false"
  WORKSPACE_IMAGE_TAG: "develop"
  # To debug upload stage, you can limit BUILD_DISTROS_REGEX to jammy and allow
  # run_test distros to fail, by setting ALLOW_RUN_TESTS_TO_FAIL to true.
  ALLOW_RUN_TESTS_TO_FAIL: false
  # "auto" uses Kali's stock mirror (http.kali.org). If a Kali job fails with
  # "APT mirror failed", rerun the pipeline from the UI with another mirror.
  # A project CI/CD variable can set any URL.
  KALI_MIRROR:
    value: "auto"
    options:
      - "auto"
      - "http://kali.download/kali"
      - "http://ftp.halifax.rwth-aachen.de/kali/"
    description: "Kali APT mirror. auto = stock http.kali.org. Pick another if a Kali job reports an APT mirror failure."
  DEBIAN_STABLE_IMAGE: debian:trixie-slim
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_AUTH_CONFIG: ${_DOCKER_AUTH_CONFIG}

workflow:
  rules:
    # Disable tag builds.
    - if: $CI_COMMIT_TAG != $CI_COMMIT_REF_NAME && $CI_PIPELINE_SOURCE != "merge_request_event"

stages:
  - www
  - build
  - functional_test
  - run_test
  - test
  - upload_build_preview
  - workspace_image

.prepare_build: &prepare_build
  - pwd
  - mkdir -p "$GITLAB_SHARED_DIND_DIR" && chmod 777 "$GITLAB_SHARED_DIND_DIR"
  - apt-get update && apt-get install -y docker.io sudo
  - echo "$DOCKER_HUB_PASSWORD" | docker login --username $DOCKER_HUB_USERNAME --password-stdin
  # DISTRO_MIRROR is passed to the distro's Dockerfiles; empty = stock mirror.
  - if [ "$DISTRO_SLUG" = kali_kali-rolling ] && [ "$KALI_MIRROR" != auto ]; then
      export DISTRO_MIRROR="$KALI_MIRROR";
    fi

.prepare_www: &prepare_www
  - tar -zxf output/www/kasm_www.tar.gz -C builder/
  - touch builder/www

.prepare_artfacts: &prepare_artfacts
  - cp -r builder/build/* output/
  - rm output/*.tar.gz

.enable_core_dumps: &enable_core_dumps
  - echo core > /proc/sys/kernel/core_pattern

.parallel_matrix: &parallel_matrix
  matrix:
      - DISTRO: 'ubuntu jammy'
        DISTRO_SLUG: 'ubuntu_jammy'
        LEGACY_REQUIRED: "false"
        GROUP: 1
      - DISTRO: 'ubuntu noble'
        DISTRO_SLUG: 'ubuntu_noble'
        LEGACY_REQUIRED: "false"
        GROUP: 2
      - DISTRO: 'ubuntu resolute'
        DISTRO_SLUG: 'ubuntu_resolute'
        LEGACY_REQUIRED: "false"
        GROUP: 3
      - DISTRO: 'debian bookworm'
        DISTRO_SLUG: 'debian_bookworm'
        LEGACY_REQUIRED: "false"
        GROUP: 4
      - DISTRO: 'debian trixie'
        DISTRO_SLUG: 'debian_trixie'
        LEGACY_REQUIRED: "false"
        GROUP: 5
      - DISTRO: 'kali kali-rolling'
        DISTRO_SLUG: 'kali_kali-rolling'
        LEGACY_REQUIRED: "false"
        GROUP: 6
      - DISTRO: 'oracle 8'
        DISTRO_SLUG: 'oracle_8'
        LEGACY_REQUIRED: "true"
        GROUP: 7
      - DISTRO: 'oracle 9'
        DISTRO_SLUG: 'oracle_9'
        LEGACY_REQUIRED: "false"
        GROUP: 8
      - DISTRO: 'opensuse 15'
        DISTRO_SLUG: 'opensuse_15'
        LEGACY_REQUIRED: "true"
        GROUP: 9
      - DISTRO: 'opensuse 16'
        DISTRO_SLUG: 'opensuse_16'
        LEGACY_REQUIRED: "false"
        GROUP: 10
      - DISTRO: 'fedora 42'
        DISTRO_SLUG: 'fedora_42'
        LEGACY_REQUIRED: "false"
        GROUP: 11
      - DISTRO: 'fedora 43'
        DISTRO_SLUG: 'fedora_43'
        LEGACY_REQUIRED: "false"
        GROUP: 12


default:
  retry: 2
  tags:
    - oci-fixed-amd

functional_test:
  stage: functional_test
  variables:
    FUNCTIONAL_TEST_TIER: "minimal"
    DOCKER_BUILDKIT: "1"
    BUILDKIT_PROGRESS: "plain"
  image: $DEBIAN_STABLE_IMAGE
  tags:
    - oci-fixed-amd
  before_script:
    - *prepare_build
    - . .ci/helpers.sh
  script:
    - prepare_to_run_functional_tests
    - set +e; ./functional-test --tier minimal --package "$FUNCTIONAL_TEST_PACKAGE"; exit_code=$?; set -e
    - upload_report_to_s3
    - put_report_into_ci_pipeline "$exit_code"
    - exit "$exit_code"
  needs:
    - job: build_amd64
      optional: true
    - job: build_portable_amd64
      optional: true
  artifacts:
    paths:
      - kasmvnc-functional-tests/report/
    when: always
    expire_in: 14 days
    reports:
      junit:
        - kasmvnc-functional-tests/report/*/junit.xml
  allow_failure: false
  rules:
    - when: on_success


# Initial Standard qualification is opt-in. Set RUN_STANDARD=true to require
# success for a qualification pipeline. MR merge gating needs a separate workflow
# change: this repository currently excludes merge_request_event pipelines.
functional_test_standard:
  stage: functional_test
  image: python:3.13-slim-trixie
  services: []
  timeout: 90m
  retry: 0
  variables:
    FUNCTIONAL_TEST_TIER: "standard"
  needs:
    - job: build_portable_amd64
      optional: true
    - job: build_portable_musl_amd64
      optional: true
  before_script:
    - . .ci/helpers.sh
    - prepare_to_run_scripts_and_s3_uploads
    - apt-get install -y --no-install-recommends openssh-client ca-certificates
    - python -m venv kasmvnc-functional-tests/.vm/venv
    - kasmvnc-functional-tests/.vm/venv/bin/python -m pip install --no-cache-dir -r kasmvnc-functional-tests/requirements-vm.txt
  script:
    - prepare_standard_functional_tests
    - >-
      set +e;
      (export AWS_ACCESS_KEY_ID="${EC2_LAUNCHER_ID:-$AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY="${EC2_LAUNCHER_SECRET:-$AWS_SECRET_ACCESS_KEY}";
      if [ -n "${EC2_LAUNCHER_ID:-}" ]; then unset AWS_SESSION_TOKEN AWS_SECURITY_TOKEN; fi;
      .vm/venv/bin/python -m virtualization.matrix --state .vm/state.json --report-dir report
      --package-deb "$FUNCTIONAL_TEST_DEB" --package-rpm "$FUNCTIONAL_TEST_RPM");
      exit_code=$?; set -e
    - upload_report_to_s3
    - put_report_into_ci_pipeline "$exit_code"
    - exit "$exit_code"
  after_script:
    - cd "$CI_PROJECT_DIR/kasmvnc-functional-tests"
    - >-
      if [ -f .vm/state.json ]; then
      (export AWS_ACCESS_KEY_ID="${EC2_LAUNCHER_ID:-$AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY="${EC2_LAUNCHER_SECRET:-$AWS_SECRET_ACCESS_KEY}";
      if [ -n "${EC2_LAUNCHER_ID:-}" ]; then unset AWS_SESSION_TOKEN AWS_SECURITY_TOKEN; fi;
      .vm/venv/bin/python -m virtualization cleanup --state .vm/state.json --report-dir report);
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths: [kasmvnc-functional-tests/report/]
    reports:
      junit: kasmvnc-functional-tests/report/*/*/junit.xml
  rules:
    - if: '$BUILD_PORTABLE == "false" || $BUILD_DISTROS_REGEX == "none"'
      when: never
    - if: '$RUN_STANDARD == "true"'
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true

build_www:
  stage: www
  allow_failure: false
  image: $DEBIAN_STABLE_IMAGE
  tags:
    - oci-fixed-amd
  before_script:
    - *prepare_build
  script:
    - apt-get install -y git
    - builder/build-www
    - mkdir -p output/www
    - cd builder
    - echo $PWD
    - ls -l
    - ls -l ../output
    - tar -zcvf ../output/www/kasm_www.tar.gz www www-supply-chain
  only:
    variables:
      - $BUILD_DISTROS_REGEX !~ /^none$/
  artifacts:
    paths:
      - output/

build_amd64:
  stage: build
  image: $DEBIAN_STABLE_IMAGE
  tags:
    - oci-fixed-amd
  before_script:
    - *prepare_build
    - *prepare_www
    - . .ci/helpers.sh
  after_script:
    - *prepare_artfacts
  script:
    - if ! is_build_this_distro "$DISTRO"; then
        exit 1;
      fi
    - builder/build-package $DISTRO
    - upload_packages $DISTRO
    - bash .ci/record-workspace-package
  artifacts:
    paths:
      - output/
  cache:
    key: "sccache-$CI_RUNNER_EXECUTABLE_ARCH-$CI_COMMIT_REF_SLUG-$DISTRO_SLUG"
    paths:
      - builder/build/.sccache
    policy: pull-push

  resource_group: "concurrent_$GROUP"
  parallel:
    *parallel_matrix
  rules:
    - if: '$BUILD_FULL_LEGACY != "true" && $BUILD_PORTABLE != "false" && $LEGACY_REQUIRED != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\//'
      allow_failure: false
    - allow_failure: true

build_arm64:
  stage: build
  image: $DEBIAN_STABLE_IMAGE
  tags:
    - oci-fixed-arm
  before_script:
    - *prepare_build
    - *prepare_www
    - . .ci/helpers.sh
  after_script:
    - *prepare_artfacts
  script:
    - set -e
    - if ! is_build_this_distro "$DISTRO"; then
        exit 1;
      fi
    - builder/build-package $DISTRO
    - upload_packages $DISTRO
    - bash .ci/record-workspace-package
  artifacts:
    paths:
      - output/
  cache:
    key: "sccache-$CI_RUNNER_EXECUTABLE_ARCH-$CI_COMMIT_REF_SLUG-$DISTRO_SLUG"
    paths:
      - builder/build/.sccache
    policy: pull-push
  resource_group: "concurrent_$GROUP"
  parallel:
    *parallel_matrix
  rules:
    - if: '$BUILD_FULL_LEGACY != "true" && $BUILD_PORTABLE != "false" && $LEGACY_REQUIRED != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^release\//'
      allow_failure: false
    - allow_failure: true


run_test_amd64:
  stage: run_test
  image: $DEBIAN_STABLE_IMAGE
  tags:
    - oci-fixed-amd
  before_script:
    - *prepare_build
    - *enable_core_dumps
    - . .ci/helpers.sh
  script:
    - set -e
    - is_build_this_distro "$DISTRO" && builder/test-barebones --run-test $DISTRO
  rules:
    - if: '$BUILD_FULL_LEGACY != "true" && $BUILD_PORTABLE != "false" && $LEGACY_REQUIRED != "true"'
      when: never
    - if: $ALLOW_RUN_TESTS_TO_FAIL == "false"
    - if: $ALLOW_RUN_TESTS_TO_FAIL == "true"
      allow_failure: true
  dependencies:
    - build_amd64
  artifacts:
    when: always
    paths:
      - run_test/core_dumps/*/core
    reports:
      junit:
        - run_test/*.xml
  parallel:
    *parallel_matrix

run_test_arm64:
  stage: run_test
  image: $DEBIAN_STABLE_IMAGE
  tags:
    - oci-fixed-arm
  before_script:
    - *prepare_build
    - *enable_core_dumps
    - . .ci/helpers.sh
  script:
    - set -e
    - is_build_this_distro "$DISTRO" && builder/test-barebones --run-test $DISTRO
  rules:
    - if: '$BUILD_FULL_LEGACY != "true" && $BUILD_PORTABLE != "false" && $LEGACY_REQUIRED != "true"'
      when: never
    - if: $ALLOW_RUN_TESTS_TO_FAIL == "false"
    - if: $ALLOW_RUN_TESTS_TO_FAIL == "true"
      allow_failure: true
  dependencies:
    - build_arm64
  artifacts:
    when: always
    paths:
      - run_test/core_dumps/*/core
    reports:
      junit:
        - run_test/*.xml
  parallel:
    *parallel_matrix

spec_dependencies:
  stage: build
  image: $DEBIAN_STABLE_IMAGE
  tags:
    - kasmvnc-x86
  needs: []
  resource_group: spec-dependencies-amd64
  rules:
    - if: '$BUILD_DISTROS_REGEX == "none"'
      when: never
    - when: on_success
  before_script:
    - *prepare_build
  script:
    - apt-get install -y python3
    - python3 builder/portable/test-spec-cache.py
    - builder/prepare-spec-image

spec_test:
  stage: test
  image: $DEBIAN_STABLE_IMAGE
  tags:
    - kasmvnc-x86
  rules:
    - if: '$BUILD_DISTROS_REGEX == "none"'
      when: never
    - if: '$BUILD_PORTABLE != "false"'
      needs: [spec_dependencies, build_portable_amd64]
    - when: on_success
      needs:
        - spec_dependencies
        - job: build_amd64
          optional: true
  before_script:
    - *prepare_build
  artifacts:
    reports:
      junit:
        - SelfBench.xml
        - Benchmark.xml
  script:
    - apt-get install -y python3
    - |
      if [ "$BUILD_PORTABLE" != "false" ]; then
        KASMVNC_PACKAGE_DIR=output/portable_amd64 builder/test-vncserver
      else
        builder/test-vncserver
      fi


make_build_preview_html:
  stage: upload_build_preview
  image: $DEBIAN_STABLE_IMAGE
  tags:
    - oci-fixed-amd
  artifacts:
    paths:
      - output/index.html
  before_script:
    - . .ci/helpers.sh
  script:
    - prepare_to_run_scripts_and_s3_uploads
    - make_package_index_html > output/index.html
    - upload_package_index_to_build_dir_for_debugging output/index.html

upload_build_preview_html:
  stage: upload_build_preview
  needs: ["make_build_preview_html"]
  dependencies: ["make_build_preview_html"]
  image: $DEBIAN_STABLE_IMAGE
  tags:
    - oci-fixed-amd
  before_script:
    - . .ci/helpers.sh
  resource_group: upload_build_preview_html
  only:
    variables:
      - $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - prepare_to_run_scripts_and_s3_uploads
    - preview_builds_dir=kasmvnc/preview-builds
    - upload_to_s3 "output/index.html" "$preview_builds_dir/index.html" "$S3_BUCKET"
    - show_file_link_in_ci "index.html" "$UPLOADED_FILE_S3_URL"

# Optional end-to-end images; each job consumes only its native Noble package.
.workspace_image:
  stage: workspace_image
  image: $DEBIAN_STABLE_IMAGE
  variables:
    GIT_SUBMODULE_STRATEGY: none
    WORKSPACE_CORE_REF: develop
    WORKSPACE_DESKTOP_REF: develop
  when: manual
  allow_failure: true
  timeout: 3h
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
  rules:
    - if: '$BUILD_DISTROS_REGEX == "none"'
      when: never
    - if: '$BUILD_PORTABLE != "false" && $BUILD_FULL_LEGACY != "true"'
      when: never
    - if: '$BUILD_DISTROS_REGEX == "all" || "ubuntu noble" =~ $BUILD_DISTROS_REGEX'
      when: manual
    - when: never
  resource_group: "workspace-$CI_COMMIT_REF_SLUG-$WORKSPACE_ARCH"
  before_script:
    # Trixie splits the CLI from docker.io; no daemon is needed in the job container.
    - apt-get update && apt-get install -y --no-install-recommends docker-cli docker-buildx git python3 ca-certificates
    - docker --version && docker buildx version
    - echo "$DOCKER_HUB_PASSWORD" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin
  script:
    - python3 .ci/build-workspace-image.py --arch "$WORKSPACE_ARCH"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - workspace-image-report/

build_workspace_noble_amd64:
  extends: .workspace_image
  tags: [oci-fixed-amd]
  variables:
    WORKSPACE_ARCH: amd64
  needs:
    - job: build_amd64
      parallel:
        matrix:
          - DISTRO: 'ubuntu noble'
            DISTRO_SLUG: 'ubuntu_noble'
            LEGACY_REQUIRED: "false"
            GROUP: 2
      artifacts: true

build_workspace_noble_arm64:
  extends: .workspace_image
  tags: [oci-fixed-arm]
  variables:
    WORKSPACE_ARCH: arm64
  needs:
    - job: build_arm64
      parallel:
        matrix:
          - DISTRO: 'ubuntu noble'
            DISTRO_SLUG: 'ubuntu_noble'
            LEGACY_REQUIRED: "false"
            GROUP: 2
      artifacts: true

# Portable builds replace modern glibc distro builds by default.
# Keep the full portable runtime matrix; legacy exceptions use the matrix above.
.build_portable:
  stage: build
  timeout: 3h
  retry:
    max: 2
    when: [runner_system_failure, api_failure]
  image: $DEBIAN_STABLE_IMAGE
  dependencies: [build_www]
  allow_failure: false
  before_script:
    - *prepare_build
    - apt-get install -y git python3
    - *prepare_www
    - . .ci/helpers.sh
  script:
    - builder/build-portable
    - builder/portable/test-security-reports
    - upload_portable_packages
    - mkdir -p output
    - cp -r builder/build/portable_* output/
  artifacts:
    when: always
    paths: [output/]
    # Published to S3 above; avoid redownloading source bundles in every distro test.
    exclude: ["output/**/*.sources.tar.gz"]
    reports:
      cyclonedx: ["output/portable_*/gl-sbom.cdx.json"]
      dependency_scanning: ["output/portable_*/gl-dependency-scanning-report.json"]
  rules:
    - if: '$BUILD_PORTABLE == "false" || $BUILD_DISTROS_REGEX == "none"'
      when: never
    - when: on_success

build_portable_amd64:
  resource_group: portable-deps-amd64
  extends: .build_portable
  tags: [oci-fixed-amd]

build_portable_arm64:
  resource_group: portable-deps-arm64
  extends: .build_portable
  tags: [oci-fixed-arm]

# One native musl build per architecture replaces the per-release Alpine builds.
# Keep a separate cache: glibc-built archives cannot be linked into musl binaries.
.build_portable_musl:
  extends: .build_portable
  script:
    - builder/build-portable --libc musl
    - builder/portable/test-security-reports
    - upload_portable_packages
    - mkdir -p output
    - cp -r builder/build/portable_musl_* output/

build_portable_musl_amd64:
  extends: .build_portable_musl
  resource_group: portable-musl-deps-amd64
  tags: [oci-fixed-amd]

build_portable_musl_arm64:
  extends: .build_portable_musl
  resource_group: portable-musl-deps-arm64
  tags: [oci-fixed-arm]

.test_portable:
  stage: run_test
  timeout: 40m
  retry:
    max: 2
    when: [runner_system_failure, api_failure]
  image: $DEBIAN_STABLE_IMAGE
  allow_failure: false
  before_script:
    - *prepare_build
    - apt-get install -y python3 curl
  script:
    - builder/test-portable "output/portable_${PORTABLE_ARCH}" --case "$PORTABLE_CASE" --arch "$PORTABLE_ARCH" --results "output/portable-tests/${PORTABLE_ARCH}/${PORTABLE_CASE}"
  artifacts:
    when: always
    paths: [output/portable-tests/]
  rules:
    - if: '$BUILD_PORTABLE == "false" || $BUILD_DISTROS_REGEX == "none"'
      when: never
    - when: on_success

test_portable_amd64:
  extends: .test_portable
  tags: [oci-fixed-amd]
  needs: [build_portable_amd64]
  variables:
    PORTABLE_ARCH: amd64
  parallel:
    matrix:
      - PORTABLE_CASE: [kasmos-kasmos, ubuntu-jammy, ubuntu-noble, ubuntu-resolute, debian-bookworm, debian-trixie, kali-rolling, oracle-9, rhel-9, rockylinux-9, almalinux-9, opensuse-16, fedora-42, fedora-43, parrotos-7, cuda-jammy]

test_portable_arm64:
  extends: .test_portable
  tags: [oci-fixed-arm]
  needs: [build_portable_arm64]
  variables:
    PORTABLE_ARCH: arm64
  parallel:
    matrix:
      - PORTABLE_CASE: [kasmos-kasmos, ubuntu-jammy, ubuntu-noble, ubuntu-resolute, debian-bookworm, debian-trixie, kali-rolling, oracle-9, rhel-9, rockylinux-9, almalinux-9, opensuse-16, fedora-42, fedora-43, parrotos-7]

.test_portable_musl:
  extends: .test_portable
  script:
    - builder/test-portable "output/portable_musl_${PORTABLE_ARCH}" --case "$PORTABLE_CASE" --arch "$PORTABLE_ARCH" --formats native --results "output/portable-tests/${PORTABLE_ARCH}/${PORTABLE_CASE}"
  parallel:
    matrix:
      - PORTABLE_CASE: [alpine-3.21, alpine-3.22, alpine-3.23, alpine-3.24]

test_portable_musl_amd64:
  extends: .test_portable_musl
  tags: [oci-fixed-amd]
  needs: [build_portable_musl_amd64]
  variables:
    PORTABLE_ARCH: amd64

test_portable_musl_arm64:
  extends: .test_portable_musl
  tags: [oci-fixed-arm]
  needs: [build_portable_musl_arm64]
  variables:
    PORTABLE_ARCH: arm64

# Fast component tests use this checkout, never the standalone source overrides.
.unit_test:
  stage: test
  image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
  services: []
  needs: []
  timeout: 20m
  variables:
    GIT_SUBMODULE_PATHS: "kasmweb kasmvnc-unit-tests"
  before_script:
    - sh kasmvnc-unit-tests/container/install-deps
  script:
    - UNIT_INSIDE_CONTAINER=1 kasmvnc-unit-tests/run-unit-tests "$CI_PROJECT_DIR" "$UNIT_SUITE"
  allow_failure: false
  retry:
    max: 2
    when: [runner_system_failure, api_failure]
  artifacts:
    when: always
    expire_in: 14 days
    paths: [kasmvnc-unit-tests/reports/]

unit_test:
  extends: .unit_test
  variables: {UNIT_SUITE: cpp}
  artifacts:
    reports:
      junit: kasmvnc-unit-tests/reports/cpp/cpp.xml
      coverage_report:
        coverage_format: cobertura
        path: kasmvnc-unit-tests/reports/cpp/cpp-coverage.xml

unit_test_frontend:
  extends: .unit_test
  variables: {UNIT_SUITE: frontend}
  artifacts:
    reports:
      junit: kasmvnc-unit-tests/reports/frontend/frontend.xml
      coverage_report:
        coverage_format: cobertura
        path: kasmvnc-unit-tests/reports/frontend/cobertura-coverage.xml

unit_test_sanitizers:
